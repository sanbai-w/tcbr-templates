      }

        font-size: 14px;

        z-index: 2;

        padding: 0 8px;

        justify-content: center;

        border-radius: 4px;
        margin: 16px 0;

        text-align: center;
        font-size: 14px;
      }

      .db-warning .warning-icon {
        color: #f39c12;
        margin-right: 8px;
      }

      .db-warning .config-link {
        color: #007bff;
        text-decoration: underline;
        cursor: pointer;
      }
    </style>

  <script
    src="https://code.jquery.com/jquery-1.12.4.min.js"

  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"
  ></script>
  <script>
    let dbConnected = false;

    init();

    function init() {
      // 检查数据库状态
      checkDBStatus();

      // 如果数据库连接正常，获取计数
      if (dbConnected) {
        getCount();
      }
    }

    function checkDBStatus() {
      $.ajax("/api/status", {
        method: "get",
      })
        .done(function (res) {
          if (res && res.data) {
            dbConnected = res.data.connected;
            updateUI();
          }
        })
        .fail(function () {
          dbConnected = false;
          updateUI();
        });
    }

    function updateUI() {
      if (!dbConnected) {
        // 显示数据库连接警告
        $("#db-warning").show();
        $("#count-number").text("未连接");
        $("#count-button").prop("disabled", true).css("opacity", "0.5");
      } else {
        // 隐藏警告，启用功能
        $("#db-warning").hide();
        $("#count-button").prop("disabled", false).css("opacity", "1");
        getCount();
      }
    }

    function getCount() {
      $.ajax("/api/count", {
        method: "get",
      })
        .done(function (res) {
          if (res && res.code === 0 && res.data !== undefined) {
            $(".count-number").html(res.data);
          } else if (res && res.code === -1) {
            $(".count-number").html("错误");
            console.error("获取计数失败:", res.message);
          }
        })
        .fail(function () {
          $(".count-number").html("请求失败");
        });
    }

    function set(action) {
      if (!dbConnected) {
        alert("数据库未连接，请先检查配置");
        return;
      }

      $.ajax("/api/count", {
        method: "POST",
        contentType: "application/json; charset=utf-8",
        dataType: "json",
        data: JSON.stringify({
          action: action,
        }),
      })
        .done(function (res) {
          if (res && res.code === 0 && res.data !== undefined) {
            $(".count-number").html(res.data);
          } else if (res && res.code === -1) {
            alert("操作失败: " + res.message);
          }
        })
        .fail(function () {
          alert("请求失败，请检查网络连接");
        });
    }

    function showConfigHelp() {
      const helpText = `数据库配置说明：

方式 1.（适用于从模板部署）进入服务详情页，选择更新服务，在高级设计区块配置环境变量

   MYSQL_USERNAME=你的数据库用户名
   MYSQL_PASSWORD=你的数据库密码
   MYSQL_ADDRESS=数据库地址:端口 (如: localhost:3306)
   MYSQL_DATABASE=数据库名称
   TABLE_NAME=表名 (可选，默认为 counters)

方式 2.（适用于从源码部署）进入服务详情页，选择在线开发，在编辑器中修改 .env 文件中的配置

完成后部署服务即可。`;

      alert(helpText);
    }
  </script>
